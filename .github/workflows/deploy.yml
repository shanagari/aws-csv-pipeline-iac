name: Deploy CSV Pipeline

on:
  push:
    branches: [main]
    paths:
      - "pipeline.yaml"
      - "scripts/transform.py"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      notification_email:
        description: "Email for pipeline failure alerts (optional)"
        required: false
        default: ""

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --template-file pipeline.yaml \
            --stack-name csv-pipeline-stack \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides NotificationEmail="${{ github.event.inputs.notification_email }}"

      - name: Upload Glue ETL script
        run: |
          SCRIPTS_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name csv-pipeline-stack \
            --query "Stacks[0].Outputs[?OutputKey=='ScriptsBucketName'].OutputValue" \
            --output text)
          aws s3 cp scripts/transform.py "s3://${SCRIPTS_BUCKET}/scripts/transform.py"

      - name: Print pipeline info
        run: |
          aws cloudformation describe-stacks \
            --stack-name csv-pipeline-stack \
            --query "Stacks[0].Outputs" \
            --output table
