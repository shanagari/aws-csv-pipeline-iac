name: Destroy CSV Pipeline

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to confirm stack teardown'
        required: true
        default: ""

jobs:
  destroy:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm == 'destroy' }}
    permissions:
      id-token: write   # required to request the OIDC token
      contents: read    # required to check out the repo
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC — no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Empty S3 buckets
        run: |
          for KEY in InputBucketName OutputBucketName ScriptsBucketName; do
            BUCKET=$(aws cloudformation describe-stacks \
              --stack-name csv-pipeline-stack \
              --query "Stacks[0].Outputs[?OutputKey=='${KEY}'].OutputValue" \
              --output text)
            if [ -n "${BUCKET}" ] && [ "${BUCKET}" != "None" ]; then
              echo "Emptying s3://${BUCKET}"
              aws s3 rm "s3://${BUCKET}" --recursive || true
            fi
          done

      - name: Delete CloudFormation stack
        run: |
          aws cloudformation delete-stack --stack-name csv-pipeline-stack
          aws cloudformation wait stack-delete-complete --stack-name csv-pipeline-stack
